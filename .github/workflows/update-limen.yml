name: Pin LIMEN revision

on:
  workflow_dispatch:
    inputs:
      limen_revision:
        description: Full LIMEN commit SHA to test and pin
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: update-limen
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.sha }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - name: Checkout HashLink
        uses: actions/checkout@v7
        with:
          path: hashlink
          persist-credentials: false

      - name: Checkout LIMEN revision
        uses: actions/checkout@v7
        with:
          repository: NMB-Team/Limen
          ref: ${{ inputs.limen_revision }}
          path: limen-validation
          persist-credentials: false

      - name: Validate requested revision
        id: resolve
        env:
          REQUESTED_REVISION: ${{ inputs.limen_revision }}
        run: |
          revision=$(git -C limen-validation rev-parse HEAD)
          if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::LIMEN revision must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$REQUESTED_REVISION" != "$revision" ]]; then
            echo "::error::Requested $REQUESTED_REVISION, but checked out $revision"
            exit 1
          fi

          pinned=$(git -C hashlink rev-parse HEAD:libs/limen)
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          if [[ "$revision" == "$pinned" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      limen_revision: ${{ needs.resolve.outputs.revision }}
    secrets: inherit

  update:
    needs: [resolve, integration]
    if: needs.resolve.outputs.changed == 'true' && needs.integration.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested HashLink revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Update pinned LIMEN revision
        env:
          LIMEN_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          git -C libs/limen fetch --depth 1 origin "$LIMEN_REVISION"
          git -C libs/limen checkout --detach "$LIMEN_REVISION"

      - name: Commit tested revision
        env:
          LIMEN_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          if git diff --quiet -- libs/limen; then
            echo "HashLink already pins $LIMEN_REVISION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/limen
          git commit \
            -m "sync(limen): ${LIMEN_REVISION:0:7}" \
            -m "Source-Repository: NMB-Team/Limen" \
            -m "Source-Commit: $LIMEN_REVISION"
          git push origin HEAD:master
