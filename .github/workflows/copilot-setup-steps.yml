name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            cmake \
            libasound2-dev \
            libaudio-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libjack-dev \
            libmbedtls-dev \
            libopenal-dev \
            libpipewire-0.3-dev \
            libpng-dev \
            libpulse-dev \
            libsndio-dev \
            libturbojpeg-dev \
            libudev-dev \
            liburing-dev \
            libuv1-dev \
            libvulkan-dev \
            libvorbis-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libsqlite3-dev \
            pkg-config \
            wget

      - name: Download LIMEN binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          revision=$(git rev-parse HEAD:libs/limen)
          release_revision=$(gh release view latest \
            --repo NMB-Team/Limen \
            --json targetCommitish \
            --jq .targetCommitish)
          if [[ "$release_revision" != "$revision" ]]; then
            echo "::error::LIMEN latest release targets $release_revision, but HashLink pins $revision"
            exit 1
          fi

          asset=limen-linux-x64.tar.gz
          download_dir="$RUNNER_TEMP/limen-release"
          mkdir -p "$download_dir" limen-prebuilt
          gh release download latest \
            --repo NMB-Team/Limen \
            --pattern "$asset" \
            --dir "$download_dir"
          tar -xzf "$download_dir/$asset" -C limen-prebuilt

          for file in limen.hdll opengl.limen vulkan.limen libshaderc.so.1; do
            if [[ ! -f "limen-prebuilt/$file" ]]; then
              echo "::error::$asset does not contain $file"
              exit 1
            fi
          done

          echo "LIMEN_PREBUILT_DIR=$PWD/limen-prebuilt" >> "$GITHUB_ENV"

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: latest

      - name: Configure haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hashlink

      - name: Build and install HashLink
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DWITH_LIMEN=OFF \
            -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
          cmake --build build --parallel
          sudo cmake --install build
          sudo ldconfig
