# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      limen_revision:
        description: Exact LIMEN commit to test instead of the pinned revision
        required: false
        type: string
  workflow_call:
    inputs:
      limen_revision:
        description: Exact LIMEN commit to test instead of the pinned revision
        required: false
        type: string

defaults:
  run:
    shell: bash

env:
  LIMEN_GIT_TAG: ${{ inputs.limen_revision || '' }}

jobs:

  ###########################################################
  build:
  ###########################################################
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        target: [linux, darwin, windows]
        architecture: [64, arm64]
        build_system: [make, cmake, cmake-mingw, cmake-clang-cl, vs2026, makegcc14]

        include:
          - target: linux
            archive_ext: tar.gz

          - target: linux
            runner: ubuntu-latest
            haxe_nightly_dir: linux64

          - target: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            haxe_nightly_dir: linux-arm64

          - target: darwin
            haxe_nightly_dir: mac
            archive_ext: tar.gz

          - target: darwin
            architecture: 64
            runner: macos-15-intel

          - target: darwin
            architecture: arm64
            runner: macos-latest

          - build_system: cmake
            cmake_configuration: RelWithDebInfo

          - build_system: cmake-mingw
            cmake_configuration: RelWithDebInfo

          - build_system: cmake-clang-cl
            cmake_configuration: RelWithDebInfo

          - build_system: vs2026
            msbuild_configuration: Release

          - target: windows
            runner: windows-2025-vs2026 # has VS 2026 preinstalled which supports PlatformToolset <= v145, WindowsTargetPlatformVersion 10
            haxe_nightly_dir: windows64
            archive_ext: zip

          - target: windows
            build_system: cmake
            cmake_generator: Visual Studio 18 2026

          - target: windows
            runner: windows-latest
            build_system: cmake-mingw

          - target: windows
            build_system: cmake-clang-cl
            cmake_generator: Visual Studio 18 2026

          - target: windows
            architecture: 64
            architecture_string: x64

        exclude:
          - target: linux
            build_system: vs2026

          - target: darwin
            build_system: vs2026

          - target: windows
            architecture: arm64

          - target: windows
            build_system: make

          - target: darwin
            build_system: makegcc14

          - target: windows
            build_system: makegcc14

          - target: darwin
            build_system: cmake-mingw

          - target: linux
            build_system: cmake-mingw

          - target: darwin
            build_system: cmake-clang-cl

          - target: linux
            build_system: cmake-clang-cl

    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: "Download: LIMEN binaries"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        release_revision=$(gh release view latest \
          --repo NMB-Team/Limen \
          --json targetCommitish \
          --jq .targetCommitish)
        revision="${LIMEN_GIT_TAG:-$release_revision}"
        if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::LIMEN revision must be a full lowercase commit SHA, got '$revision'"
          exit 1
        fi
        if [[ -n "${LIMEN_GIT_TAG:-}" && "$release_revision" != "$revision" ]]; then
          echo "::error::LIMEN latest release targets $release_revision, not requested revision $revision"
          exit 1
        fi

        git -C libs/limen fetch --depth 1 origin "$revision"
        git -C libs/limen checkout --detach "$revision"

        case "${{ matrix.target }}${{ matrix.architecture }}" in
          linux64) platform=linux-x64 ;;
          linuxarm64) platform=linux-arm64 ;;
          darwin64) platform=macos-x64 ;;
          darwinarm64) platform=macos-arm64 ;;
          windows64)
            if [[ "${{ matrix.build_system }}" == "cmake-mingw" ]]; then
              platform=windows-x64-mingw
            else
              platform=windows-x64
            fi
            ;;
          *)
            echo "::error::No LIMEN package for ${{ matrix.target }} ${{ matrix.architecture }}"
            exit 1
            ;;
        esac

        case "$platform" in
          windows-*) extension=zip ;;
          *) extension=tar.gz ;;
        esac

        asset="limen-${platform}.${extension}"
        download_dir="$RUNNER_TEMP/limen-release"
        mkdir -p "$download_dir" limen-prebuilt
        gh release download latest \
          --repo NMB-Team/Limen \
          --pattern "$asset" \
          --dir "$download_dir"

        case "$extension" in
          zip) 7z x "$download_dir/$asset" -olimen-prebuilt ;;
          tar.gz) tar -xzf "$download_dir/$asset" -C limen-prebuilt ;;
        esac

        expected=(limen.hdll opengl.limen)
        case "$platform" in
          linux-*) expected+=(vulkan.limen libshaderc.so.1) ;;
          windows-x64-mingw)
            expected+=(vulkan.limen d3d11.limen)
            expected+=(liblimen.dll.a liblimen_opengl.dll.a liblimen_vulkan.dll.a liblimen_d3d11.dll.a)
            ;;
          windows-x64)
            expected+=(vulkan.limen d3d11.limen d3d12.limen)
            expected+=(limen.lib limen_opengl.lib limen_vulkan.lib limen_d3d11.lib limen_d3d12.lib)
            expected+=(dxcompiler.dll dxil.dll)
            ;;
        esac
        for file in "${expected[@]}"; do
          if [[ ! -f "limen-prebuilt/$file" ]]; then
            echo "::error::$asset does not contain $file"
            exit 1
          fi
        done

        echo "LIMEN_PREBUILT_DIR=$PWD/limen-prebuilt" >> "$GITHUB_ENV"
        ls -la limen-prebuilt

    - name: "Add msbuild to PATH"
      if: matrix.build_system == 'vs2026'
      uses: microsoft/setup-msbuild@v3

    - name: "Mac homebrew workaround"
      if: matrix.target == 'darwin'
      run: |
        # see https://github.com/Homebrew/homebrew-core/issues/165793#issuecomment-1989441193
        # see https://github.com/Homebrew/brew/blob/master/.github/workflows/tests.yml
        brew untap aws/tap || true
        brew unlink python && brew link --overwrite python

    - name: "Install: Required Dev Packages"
      run: |
        set -ex

        case "${{ matrix.target }}" in
          linux)
            if [ ${{matrix.architecture}} == 32 ]; then
              echo "MARCH=32" >> $GITHUB_ENV
              sudo dpkg --add-architecture i386
              SUFFIX=":i386"
              EXTRA_APT_PKGS="gcc-multilib g++-multilib"
            fi

            sudo apt-get update -y
            sudo apt-get install --no-install-recommends -y \
              libmbedtls-dev${SUFFIX} \
              libopenal-dev${SUFFIX} \
              libturbojpeg-dev${SUFFIX} \
              libuv1-dev${SUFFIX} \
              libvorbis-dev${SUFFIX} \
              libsqlite3-dev${SUFFIX} \
              ${EXTRA_APT_PKGS}
            ;;

          darwin)
            if [ "${{matrix.build_system}}" != "cmake" ]; then
              brew update
              brew bundle --no-upgrade
            fi
            ;;

          windows)
            if [[ ${{ matrix.build_system }}${{ matrix.architecture }} == cmake-mingw32 ]]; then
              echo "C:\mingw32\bin" >> $GITHUB_PATH
            fi

            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/openal.zip https://github.com/kcat/openal-soft/releases/download/1.23.1/openal-soft-1.23.1-bin.zip
            7z x /tmp/openal.zip -oinclude; mv include/openal* include/openal
            ;;
        esac

    - name: "Install: GCC 14"
      if: matrix.build_system == 'makegcc14'
      run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          if [[ ${{ matrix.architecture }} == 32 ]]; then
            sudo apt install -y gcc-14-multilib g++-14-multilib
          fi
          gcc --version

    - name: Install haxe
      uses: krdlab/setup-haxe@master
      with:
        haxe-version: latest

    - name: "Configure: Haxelib"
      run: |
        set -eux

        haxelib setup ~/haxelib
        haxelib dev hashlink other/haxelib
        haxelib list

    - name: "Build: HashLink"
      run: |
        set -eux

        case "${{ matrix.build_system }}" in
          cmake)
            case "${{ matrix.target }}${{ matrix.architecture }}" in
              windows*)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -G "${{ matrix.cmake_generator }}" \
                  -A ${{ matrix.architecture_string }} \
                  -DWITH_LIMEN=OFF \
                  -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
                ;;
              darwin64)
                cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DDOWNLOAD_DEPENDENCIES=ON \
                  -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                  -DFLAT_INSTALL_TREE=ON \
                  -DWITH_LIMEN=OFF \
                  -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
                ;;
              darwinarm64)
                cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DDOWNLOAD_DEPENDENCIES=ON \
                  -DCMAKE_OSX_ARCHITECTURES=arm64 \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                  -DFLAT_INSTALL_TREE=ON \
                  -DWITH_LIMEN=OFF \
                  -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
                ;;
              linux32)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DWITH_LIMEN=OFF \
                  -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR" \
                  -DCMAKE_TOOLCHAIN_FILE=other/cmake/linux32.toolchain.cmake
                ;;
              linux*)
                cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
                  -DWITH_LIMEN=OFF \
                  -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
                ;;
            esac

            cmake --build build --config ${{ matrix.cmake_configuration }}
            BUILD_FOLDER=build/bin
            ;;

          cmake-mingw)
            cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
              -DWITH_LIMEN=OFF \
              -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"

            cmake --build build --config ${{ matrix.cmake_configuration }} --parallel
            BUILD_FOLDER=build/bin
            ;;
          cmake-clang-cl)
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_configuration }} \
              -G "${{ matrix.cmake_generator }}" \
              -A ${{ matrix.architecture_string }} \
              -T ClangCL \
              -DWITH_LIMEN=OFF \
              -DLIMEN_PREBUILT_DIR="$LIMEN_PREBUILT_DIR"
            cmake --build build --config ${{ matrix.cmake_configuration }}
            BUILD_FOLDER=build/bin
            ;;

          vs2026)
            MSBuild.exe hl.sln //nologo //m //clp:ErrorsOnly \
              //p:Configuration=${{ matrix.msbuild_configuration }} \
              //p:Platform=${{ matrix.architecture_string }}

            case "${{ matrix.architecture }}" in
              64) BUILD_FOLDER=x64/${{ matrix.msbuild_configuration }} ;;
              32) BUILD_FOLDER=${{ matrix.msbuild_configuration }} ;;
            esac
            echo "WINDOWS_BUILD_FOLDER=$BUILD_FOLDER" >> $GITHUB_ENV
            ;;

          make*)
            if [[ ${{ matrix.target }}${{ matrix.architecture }} == linux32 ]]; then
              make
            else
              make
            fi
            sudo make install
            if [[ ${{ matrix.target }} == linux ]]; then
              sudo ldconfig
            fi
            BUILD_FOLDER=.
            ;;

        esac

        case "${{ matrix.build_system }}" in
          cmake*) ;;
          *) cp -a limen-prebuilt/. "$BUILD_FOLDER/" ;;
        esac

        ls -l $BUILD_FOLDER

    - name: "Test"
      run: |
        set -eux

        case "${{ matrix.build_system }}" in
          cmake*)
            case "${{matrix.target}}" in
              windows)
                export PATH=$(pwd)/build/bin:$PATH
                ;;
              *)
                cmake --install build --prefix /tmp/hashlink
                if [ -f /tmp/hashlink/hl ]; then /tmp/hashlink/hl --version; fi
                ;;
            esac
            cd build && ctest --verbose --build-config ${{ matrix.cmake_configuration }}
            ;;
          vs2026)
            ${{ env.WINDOWS_BUILD_FOLDER }}/hl.exe --version
            ;;
          make*)
            if [[ ${{ matrix.architecture }} != arm64 ]]; then
              ./hl --version
              case ${{ matrix.target }} in
                linux)  ldd -v ./hl ;;
                darwin) otool -L ./hl ;;
              esac

              haxe -hl hello.hl -cp other/tests -main HelloWorld -D interp \
                ${{ matrix.architecture == 32 && '-D hl-legacy32' || '' }}
              ./hl hello.hl

              # ensure the executable still works when installed globally
              cp hello.hl /tmp
              pushd /tmp
              hl hello.hl
              popd
            fi

            haxe -hl src/_main.c -cp other/tests -main HelloWorld
            make hlc
            ./hlc
            ;;
        esac

    - name: "Test haxelib build"
      run: |
        haxelib git format https://github.com/HaxeFoundation/format
        cd other/haxelib
        haxe memory.hxml
        haxe profiler.hxml
        cd ../..

    - name: "Package"
      run: |
        set -eux

        case "${{ matrix.target }}${{matrix.architecture}}" in
          darwinarm64)   platform_name=darwin-arm64 ;;
          darwin64)   platform_name=darwin ;;
          windows*)  platform_name=win${{matrix.architecture}} ;;
          linux32)   platform_name=linux-i386 ;;
          linux64)   platform_name=linux-amd64 ;;
          linuxarm64)   platform_name=linux-arm64 ;;
        esac

        short_commit=$(git rev-parse --short HEAD)

        case "${{ matrix.build_system }}" in
          cmake*)
            dist_folder=hashlink-${short_commit}-${platform_name}-${{ matrix.build_system }}
            cd build && cpack -D CPACK_PACKAGE_FILE_NAME=$dist_folder -C ${{ matrix.cmake_configuration }}

            echo "HASHLINK_DISTRIBUTION=build/bin/$dist_folder.${{ matrix.archive_ext }}" >> $GITHUB_ENV
            ;;
          *)
            dist_folder=hashlink-${short_commit}-${platform_name}
            make PACKAGE_NAME=$dist_folder MARCH=${{ matrix.architecture }} release

            echo "HASHLINK_DISTRIBUTION=$dist_folder.${{ matrix.archive_ext }}" >> $GITHUB_ENV
            ;;
        esac


    - name: "Share: build artifact"
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ matrix.target }}-${{ matrix.build_system }}-${{ matrix.architecture }}
        path: ${{ env.HASHLINK_DISTRIBUTION }}


  build-android:
    runs-on: ubuntu-latest
    steps:

    - name: "SCM Checkout"
      uses: actions/checkout@v7

    - name: Install haxe
      uses: krdlab/setup-haxe@master
      with:
        haxe-version: latest

    - name: "Configure: Haxelib"
      run: |
        set -eux

        haxelib setup ~/haxelib
        haxelib install hashlink
        haxelib list

    - name: "Build: Hashlink"
      run: |
        set -ex
        cmake -B build -G Ninja --toolchain $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_PLATFORM=24 -DANDROID_ABI=arm64-v8a -DBUILD_SHARED_LIBS=OFF \
          -DWITH_VM=OFF -DWITH_LIMEN=OFF
        cmake --build build

  haxe-test-suite:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        architecture: [x86_64, arm64]
        include:
        - architecture: arm64
          test-flags: --skip-hl-jit # not yet supported

        - os: linux
          runner: ubuntu-latest

        - os: linux
          architecture: arm64
          runner: ubuntu-24.04-arm

        - os: darwin
          architecture: x86_64
          runner: macos-15-intel

        - os: darwin
          architecture: arm64
          runner: macos-latest

        - os: windows
          runner: windows-2025-vs2026

        exclude:
        - os: windows
          architecture: arm64

    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - name: Download binary
      uses: actions/download-artifact@v8.0.1
      with:
        name: |
          ${{ matrix.os }}-cmake-${{
            matrix.architecture == 'arm64' && 'arm64' ||
            matrix.architecture == 'x86_64' && '64' ||
            matrix.architecture == 'x86_32' && '32'
          }}

    - name: Install apt packages
      if: matrix.os == 'linux'
      run: |
        if [ ${{matrix.architecture}} == x86_32 ]; then
          sudo dpkg --add-architecture i386
          SUFFIX=":i386"
          EXTRA_APT_PKGS="gcc-multilib"
          printf '#!/bin/sh\n/usr/bin/gcc -m32 "$@"\n' > /usr/local/bin/gcc
          chmod +x /usr/local/bin/gcc
        fi
        sudo apt-get update -qqy
        sudo apt-get install -qqy libjpeg-turbo8${SUFFIX} libturbojpeg${SUFFIX} zlib1g${SUFFIX} libogg0${SUFFIX} libvorbis0a${SUFFIX} \
          libvorbisfile3${SUFFIX} libvorbisenc2${SUFFIX} libsqlite3-0${SUFFIX} ${EXTRA_APT_PKGS}

    - name: Install brew packages
      if: matrix.os == 'darwin'
      run: |
        brew untap aws/tap || true
        brew update
        brew install jpeg-turbo libvorbis sqlite mbedtls

    - name: Install msbuild
      uses: microsoft/setup-msbuild@v3
      if: matrix.os == 'windows'
      with:
        msbuild-architecture: ${{ matrix.architecture == 'x86_64' && 'x64' || 'x86' }}

    - name: Setup mingw
      if: matrix.os == 'windows' && matrix.architecture == 'x86_32'
      run: echo "C:\mingw32\bin" >> $GITHUB_PATH

    - name: Install binary (Linux/Mac)
      if: matrix.os != 'windows'
      run: |
        tar -xvzf hashlink-*.tar.gz
        package_dir=$(echo hashlink-*/)
        binary_dir="$package_dir"
        library_dir="$package_dir"
        if [[ -d "$package_dir/bin" ]]; then
          binary_dir="$package_dir/bin"
        fi
        if [[ -d "$package_dir/lib" ]]; then
          library_dir="$package_dir/lib"
        fi
        sudo mkdir -p /usr/local/{bin,lib,include}
        if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
          printf "#!/bin/sh\necho Jit is not supported on arm64\n" > /usr/local/bin/hl
          chmod +x /usr/local/bin/hl
        else
          sudo cp "$binary_dir/hl" /usr/local/bin/
        fi
        sudo cp "$library_dir"/libhl.* "$library_dir"/*.hdll "$library_dir"/*.limen /usr/local/lib/
        if [[ "${{ matrix.os }}" == "darwin" ]]; then
          sudo cp "$library_dir"/*.hdll "$library_dir"/*.limen "$library_dir"/*.dylib /usr/local/bin/
        fi
        if compgen -G "$library_dir/libshaderc.so*" > /dev/null; then
          sudo cp "$library_dir"/libshaderc.so* /usr/local/lib/
        fi
        sudo cp "$package_dir"/include/* /usr/local/include/

    - name: Install binary (Windows)
      if: matrix.os == 'windows'
      run: |
        unzip hashlink-*.zip
        echo $(cygpath -w $(pwd)/hashlink-*/) >> $GITHUB_PATH

    - name: Check binary
      run: hl --version
    - uses: krdlab/setup-haxe@master
      with:
        haxe-version: latest

    - name: Setup haxelib
      run: haxelib dev hashlink ./other/haxelib

    - name: Get Haxe commit SHA
      id: haxe_sha
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(haxe --version)
        echo "Haxe version: $version"
        short_sha=${version##*+}
        full_sha=$(gh api repos/HaxeFoundation/haxe/commits/$short_sha --jq '.sha')
        echo "Commit SHA: $short_sha, Full SHA: $full_sha"
        echo "sha=$full_sha" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: HaxeFoundation/haxe
        path: haxe
        ref: ${{ steps.haxe_sha.outputs.sha }}

    - name: Test
      run: |
        if [[ "${{ matrix.os }}" == "darwin" ]]; then
          echo "" > sys/compile-fs.hxml
        fi
        haxe --run RunCi hl ${{ matrix.test-flags }} ${{ matrix.architecture == 'x86_32' && '--skip-hlc' || '' }}
      working-directory: haxe/tests

  ###########################################################
  publish-latest-release:
  ###########################################################
    runs-on: ubuntu-latest
    needs: [build, haxe-test-suite]
    if: github.ref == 'refs/heads/master' && inputs.limen_revision == ''
    concurrency: publish-latest-release # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idconcurrency

    permissions:
      actions: read
      contents: write

    steps:

    - name: "SCM Checkout"
      uses: actions/checkout@v7

    - name: "Get: release artifacts"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu

        artifacts=(
          darwin-cmake-64
          darwin-cmake-arm64
          linux-cmake-64
          linux-cmake-arm64
          windows-cmake-64
          windows-cmake-mingw-64
        )

        for artifact in "${artifacts[@]}"; do
          for attempt in 1 2 3 4 5; do
            rm -rf "artifacts/$artifact"
            if gh run download "$GITHUB_RUN_ID" --name "$artifact" --dir "artifacts/$artifact"; then
              continue 2
            fi
            sleep $((attempt * 10))
          done

          echo "::error::Failed to download $artifact after 5 attempts"
          exit 1
        done

    - name: "Update 'latest' Release"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        short_commit=$(git rev-parse --short HEAD)
        assets=(
          "artifacts/darwin-cmake-64/hashlink-${short_commit}-darwin-cmake.tar.gz#hashlink-latest-darwin.tar.gz"
          "artifacts/darwin-cmake-arm64/hashlink-${short_commit}-darwin-arm64-cmake.tar.gz#hashlink-latest-darwin-arm64.tar.gz"
          "artifacts/linux-cmake-64/hashlink-${short_commit}-linux-amd64-cmake.tar.gz#hashlink-latest-linux-amd64.tar.gz"
          "artifacts/linux-cmake-arm64/hashlink-${short_commit}-linux-arm64-cmake.tar.gz#hashlink-latest-linux-arm64.tar.gz"
          "artifacts/windows-cmake-64/hashlink-${short_commit}-win64-cmake.zip#hashlink-latest-win64.zip"
          "artifacts/windows-cmake-mingw-64/hashlink-${short_commit}-win64-cmake-mingw.zip#hashlink-latest-win64-mingw.zip"
        )

        if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HashLink Nightly Build" \
            "${assets[@]}"
          exit 0
        fi

        gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
          -f sha="$GITHUB_SHA" \
          -F force=true

        release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id')
        while IFS= read -r asset_id; do
          [[ -z "$asset_id" ]] && continue
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
        done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id')

        gh release upload latest \
          --repo "$GITHUB_REPOSITORY" \
          "${assets[@]}"
